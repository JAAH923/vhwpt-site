# Bruce's site at review.donovanhunter.com/vhwpt/: the review copy, built by
# deploy/pho-gate.sh into /opt/pho/sites/vhwpt-review/current.
# /vhwpt/check/ is the exception: Bruce's question page, served from the rooms folder.
#
# It goes INSIDE the review.donovanhunter.com block on pho-gate (tracked in
# JAAH923/review-room deploy/Caddyfile.review.donovanhunter.com), in place of the old
# `@vhwpt` redirect to review.freshphocus.com and ABOVE the `@noslash` and `@cover`
# rooms rules, which would otherwise claim /vhwpt/. Apply with the house steps:
#   sudo cp /etc/caddy/Caddyfile /opt/pho/data/env-backups/Caddyfile.bak.$(date +%F-%H%M%S)
#   sudo -u caddy caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl reload caddy
#
# The block's own headers (noindex, nosniff, no-referrer) apply. Two differences:
# the hero comparison frames its own pages, so frames are allowed from the same
# origin; and nothing PHP or hidden is served, since pho-gate does not run PHP.
#
# Frames: the block's `header { ... -Server }` is deferred (it deletes a header), so it
# is applied last and would override a CSP set here. Its frame-ancestors 'none' line
# therefore moved out of that block into a matcher that skips /vhwpt:
#
#     @noframes not path /vhwpt /vhwpt/*
#     header @noframes Content-Security-Policy "frame-ancestors 'none'"

    # Bruce's question page: the shared client questions page (JAAH923/review-room
    # questions/index.html, published to /opt/pho/sites/rooms/questions/) at an address
    # under his site. Above @vhwpt so it wins. The link token is the URL fragment, never
    # sent here; answers go to /review-api/questions. (2026-11-08, Justin)
    @vhwptcheck path /vhwpt/check /vhwpt/check/ /vhwpt/check/index.html
    handle @vhwptcheck {
        redir /vhwpt/check /vhwpt/check/ 308
        header Cache-Control "no-store, must-revalidate"
        header Content-Security-Policy "frame-ancestors 'none'"
        root * /opt/pho/sites/rooms
        rewrite * /questions/index.html
        file_server
    }

    # Bruce's site (vhwpt.com) review copy, from JAAH923/vhwpt-site deploy/pho-gate.sh.
    @vhwpt path /vhwpt /vhwpt/*
    handle @vhwpt {
        redir /vhwpt /vhwpt/ 308
        uri strip_prefix /vhwpt
        @private path *.php */.*
        respond @private 404
        header Content-Security-Policy "frame-ancestors 'self'"
        header Cache-Control "no-cache"
        root * /opt/pho/sites/vhwpt-review/current
        try_files {path} {path}/index.html
        file_server
    }
