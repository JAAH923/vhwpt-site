# 6 wrong passwords in 10 minutes from one address = banned for an hour; a repeat offender's ban
# doubles each time, up to a week. Bruce's own mistakes: 6 tries is plenty. Tailscale addresses and
# the server itself are never banned. To unban by hand:
#   sudo fail2ban-client set vhwpt-admin unbanip <address>
[vhwpt-admin]
enabled = true
backend = auto
filter = vhwpt-admin
logpath = /var/log/caddy/vhwpt-admin.log
banaction = vhwpt-admin-caddy
maxretry = 6
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1w
ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10
