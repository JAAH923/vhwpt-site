# Wrong passwords at admin.vhwpt.com, read from Caddy's JSON access log for that site
# (/var/log/caddy/vhwpt-admin.log). A request counts only when it carried a password (Caddy writes
# the Authorization header as REDACTED, never the value) and still got 401. Opening the page with no
# password yet (the browser's first request, which also gets a 401) does not count.
# The visitor's address is client_ip: the real visitor behind Cloudflare, because the Caddyfile
# trusts only Cloudflare's addresses for CF-Connecting-IP.
# (fail2ban cuts the matched timestamp out of the line before matching, hence the optional "ts" part.)
# Test: fail2ban-regex /var/log/caddy/vhwpt-admin.log vhwpt-admin
[Definition]
failregex = ^\{"level":"[a-z]+",(?:"ts":)?[\d.]*,?"logger":"[^"]+","msg":"handled request","request":\{"remote_ip":"[^"]+","remote_port":"\d+","client_ip":"<HOST>","proto":"[^"]+","method":"[A-Z]+","host":"admin\.vhwpt\.com(?::\d+)?","uri":"(?:[^"\\]|\\.)*","headers":\{.*?"Authorization":\["REDACTED"\].*?"status":401,
ignoreregex =
datepattern = "ts":{EPOCH}
