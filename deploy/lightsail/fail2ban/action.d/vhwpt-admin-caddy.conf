# Ban action for the vhwpt-admin jail. vhwpt.com sits behind Cloudflare, so the firewall on this server
# only ever sees Cloudflare's addresses: banning the visitor there would do nothing (or lock out
# everyone). Instead the ban goes into Caddy: vhwpt-admin-ban keeps the list and rewrites
# /etc/caddy/private/vhwpt-admin-banned.caddy, and the admin.vhwpt.com site answers 429 to those
# addresses. See deploy/lightsail/bin/vhwpt-admin-ban.
[Definition]
actionstart = /usr/local/sbin/vhwpt-admin-ban clear
actionstop = /usr/local/sbin/vhwpt-admin-ban clear
actioncheck =
actionban = /usr/local/sbin/vhwpt-admin-ban ban <ip>
actionunban = /usr/local/sbin/vhwpt-admin-ban unban <ip>
