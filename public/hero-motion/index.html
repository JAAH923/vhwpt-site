<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Hero motion options</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css" />
<style>
  /*
   * Version viewer (the first piece of Site Refinery's preview): one page that
   * shows every version of a page in a real phone, iPad or desktop viewport.
   * Each version loads in an iframe at the device's true CSS size, so its own
   * breakpoints fire, then the frame is scaled down to fit the window.
   * The state lives in the hash (#c/mobile) so a link opens on one view.
   * To reuse it, change VERSIONS (and DEVICES if needed) in the script.
   */
  :root {
    --ink: #18181b; --white: #ffffff; --grey: #71717a; --hair: #e4e4e7; --whisper: #f4f4f5;
    --crimson: #c41230;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--whisper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .label { font-family: var(--mono); font-size: 11px; line-height: 1.5; letter-spacing: 0.06em; text-transform: uppercase; color: var(--grey); }

  header { background: var(--white); border-bottom: 1px solid var(--hair); padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .title { display: flex; flex-direction: column; margin-right: auto; }
  .title strong { font-size: 15px; letter-spacing: -0.01em; }
  .seg { display: inline-flex; background: var(--whisper); border-radius: 9999px; padding: 4px; gap: 2px; }
  .seg button { border-radius: 9999px; padding: 6px 14px; font-size: 14px; color: var(--grey); white-space: nowrap; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--hair); }
  .seg .name { margin-left: 6px; }
  .tools { display: inline-flex; gap: 16px; align-items: center; font-size: 14px; }
  .tools button, .tools a { color: var(--grey); text-decoration: none; }
  .tools button:hover, .tools a:hover { color: var(--ink); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 16px; }
  .frame { position: relative; background: var(--white); flex: none; overflow: hidden; }
  .frame.phone, .frame.tablet { border: 10px solid var(--ink); }
  .frame.phone { border-radius: 44px; }
  .frame.tablet { border-radius: 28px; }
  .frame.desktop { border: 1px solid var(--hair); border-radius: 12px; }
  .frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: var(--white); }
  .caption { text-align: center; max-width: 640px; }
  .caption p { margin: 4px 0 0; color: var(--grey); }

  @media (max-width: 860px) {
    header { padding: 12px 16px; }
    .seg .name { display: none; }
    .seg button { padding: 6px 12px; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <strong>Hero motion · vhwpt.com</strong>
    <span class="label">Five options · pick one</span>
  </div>
  <div class="seg" role="group" aria-label="Version" data-versions></div>
  <div class="seg" role="group" aria-label="Device" data-devices></div>
  <div class="tools">
    <button type="button" data-replay>Replay</button>
    <a data-open target="_blank" rel="noopener">Open page ↗</a>
  </div>
</header>
<main>
  <div class="frame" data-frame><iframe title="Selected version" data-iframe></iframe></div>
  <div class="caption">
    <span class="label" data-meta></span>
    <p data-about></p>
  </div>
</main>
<script>
const VERSIONS = [
  { id: "a", name: "Movement lab", file: "a.html", about: "A motion-capture figure runs windmill stretches, a walk and kettlebell swings beside the headline, with live measurements." },
  { id: "b", name: "The warm-up", file: "b.html", about: "The headline is the athlete: squats, windmills and jumps ripple through the letters." },
  { id: "c", name: "The scan", file: "c.html", about: "A body made of points does overhead squats on a turning platform while a red ring scans it." },
  { id: "d", name: "Warm-up scan", file: "d.html", about: "The letters from B settle, then the body from C scans in beside them and copies each move." },
  { id: "e", name: "Smoosh and scan", file: "e.html", about: "The headline opens spread wide, smooshes to the left, then the body scans in and runs the warm-up while the type holds still." },
];
const DEVICES = [
  { id: "mobile", name: "Mobile", w: 390, h: 844, kind: "phone" },
  { id: "ipad", name: "iPad", w: 820, h: 1180, kind: "tablet" },
  { id: "desktop", name: "Desktop", w: 1440, h: 900, kind: "desktop" },
];

const $ = (s) => document.querySelector(s);
const frame = $("[data-frame]"), iframe = $("[data-iframe]"), main = $("main");
const state = { v: VERSIONS[0].id, d: innerWidth < 860 ? "mobile" : "desktop" };

function segment(el, items, key, label) {
  for (const it of items) {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.id = it.id;
    b.innerHTML = label(it);
    b.addEventListener("click", () => { state[key] = it.id; render(true); });
    el.append(b);
  }
}
segment($("[data-versions]"), VERSIONS, "v", (v) => `${v.id.toUpperCase()}<span class="name">${v.name}</span>`);
segment($("[data-devices]"), DEVICES, "d", (d) => d.name);

function fromHash() {
  const [v, d] = location.hash.slice(1).split("/");
  if (VERSIONS.some((x) => x.id === v)) state.v = v;
  if (DEVICES.some((x) => x.id === d)) state.d = d;
}

function fit() {
  const dev = DEVICES.find((x) => x.id === state.d);
  const bezel = dev.kind === "desktop" ? 2 : 20;
  const cs = getComputedStyle(main);
  const availW = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - bezel;
  const availH = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
    - $(".caption").offsetHeight - parseFloat(cs.rowGap || 16) - bezel;
  const k = Math.max(0.1, Math.min(1, availW / dev.w, availH / dev.h));
  iframe.style.width = dev.w + "px"; iframe.style.height = dev.h + "px";
  iframe.style.transform = `scale(${k})`;
  frame.style.width = dev.w * k + bezel + "px"; frame.style.height = dev.h * k + bezel + "px";
  frame.className = "frame " + dev.kind;
  return k;
}

function render(push) {
  const v = VERSIONS.find((x) => x.id === state.v), dev = DEVICES.find((x) => x.id === state.d);
  for (const b of document.querySelectorAll("[data-versions] button")) b.setAttribute("aria-pressed", b.dataset.id === v.id);
  for (const b of document.querySelectorAll("[data-devices] button")) b.setAttribute("aria-pressed", b.dataset.id === dev.id);
  $("[data-about]").textContent = v.about; // before fit(), which measures the caption
  const k = fit();
  // Load the version only when it or the device changed; a device switch reloads
  // so the intro plays at the new size.
  const key = v.file + "@" + dev.id;
  if (iframe.dataset.key !== key) { iframe.dataset.key = key; iframe.src = v.file; }
  iframe.title = `Version ${v.id.toUpperCase()}, ${v.name}, on ${dev.name}`;
  $("[data-open]").href = v.file;
  $("[data-meta]").textContent = `${v.id.toUpperCase()} · ${v.name} · ${dev.name} ${dev.w}×${dev.h} · ${Math.round(k * 100)}%`;
  if (push) history.replaceState(null, "", `#${v.id}/${dev.id}`);
}

$("[data-replay]").addEventListener("click", () => { iframe.src = iframe.src; });
addEventListener("hashchange", () => { fromHash(); render(false); });
addEventListener("resize", () => render(false));
addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = VERSIONS.findIndex((x) => x.id === state.v);
  if (e.key === "ArrowRight") state.v = VERSIONS[(i + 1) % VERSIONS.length].id;
  else if (e.key === "ArrowLeft") state.v = VERSIONS[(i + VERSIONS.length - 1) % VERSIONS.length].id;
  else return;
  render(true);
});
fromHash();
render(false);
</script>
</body>
</html>
