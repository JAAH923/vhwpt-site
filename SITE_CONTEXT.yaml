decisions:
  - date: 2026-04-16
    decision: Add SITE_CONTEXT.yaml for cross-session continuity.
    rationale: Provide a stable, editable project memory file that future sessions can read first.
  - date: 2026-04-16
    decision: Capture the existing vhwpt.com public site map before redesign work.
    rationale: Establish a factual baseline for current pages, services, WordPress content types, and commerce scaffolding.
  - date: 2026-04-16
    decision: Save Bruce Valencia headshot and Valencia Health & Wellness logo into assets/brand.
    rationale: Keep source brand assets local for design exploration and implementation.
  - date: 2026-04-16
    decision: Use the full Valencia Health & Wellness logo as the primary logo asset.
    rationale: User clarified the attached full logo should be used; keep the square mark only as an icon/favicon-style asset.
  - date: 2026-04-16
    decision: Use the user-reuploaded local headshot and logo from assets/brand as the canonical brand images.
    rationale: User provided preferred local source files; copied them into public/assets/brand with clean filenames for Astro.
  - date: 2026-04-16
    decision: Treat WordPress as the legacy/source site only, not the rebuild platform.
    rationale: User clarified they want something more modern than WordPress for the new build.
  - date: 2026-04-16
    decision: Start the rebuild foundation with Astro and pnpm.
    rationale: Astro is modern, fast, content-friendly, and well-suited to a polished one-page service/marketing site.
  - date: 2026-04-16
    decision: Expose the local Astro dev server via Tailscale Serve.
    rationale: Allows tailnet devices to preview the local site while keeping the dev server off the public internet.
  - date: 2026-04-16
    decision: Enable Tailscale Funnel for public preview.
    rationale: Allows Bruce or other non-tailnet reviewers to access the local Astro preview through a temporary public HTTPS URL.
  - date: 2026-04-16
    decision: Upgrade the initial Astro page toward a premium one-page landing page direction.
    rationale: User felt the starter page was too basic; revised hero, trust signals, service cards, doctor section, process, and consultation CTA to feel more polished and brand-led.
  - date: 2026-04-16
    decision: Replace the card-heavy landing page with a cinematic editorial one-page direction.
    rationale: User wanted a less standard, more Apple-like premium feel; removed most card UI, enlarged type, used the logo as an atmospheric hero mark, and rebuilt services as full-width editorial scenes.
  - date: 2026-04-16
    decision: Create five parallel design concept routes using agent-generated art direction.
    rationale: User requested multiple versions from the current dark premium vibe through a clean white headshot-led direction, so concepts now live at /concepts/1 through /concepts/5 with a comparison index at /concepts.
  - date: 2026-04-17
    decision: Use Version 4 Calm Care as the foundation and reformat its top fold.
    rationale: User selected Version 4 and provided a reference with top contact strip, white nav, appointment CTA, large hero, and three visible value cards.
  - date: 2026-04-17
    decision: Optimize rendered logo assets for the Astro site.
    rationale: The header was using the 2048px 4.9 MB source PNG, so pages now render smaller header, display, and icon variants while preserving the original source asset.
  - date: 2026-04-17
    decision: Use assets/brand/bruce-headshot2.webp as the authentic Bruce Valencia headshot.
    rationale: User clarified this WebP is the correct human headshot; live pages now use public/assets/brand/bruce-headshot.webp instead of the older 200px JPEG.
  - date: 2026-04-17
    decision: Publish the Astro preview through GitHub Pages.
    rationale: User wanted a stable public client-preview URL that does not depend on Tailscale Funnel or the local Mac staying online.
  - date: 2026-04-17
    decision: Promote Version 4 Calm Care as the primary site direction.
    rationale: User chose Version 4 as the foundation and asked to deprecate all other versions; homepage now renders Version 4 and concept routes redirect home.
  - date: 2026-04-17
    decision: Rework the homepage above-the-fold into a white editorial clinic layout.
    rationale: User preferred a reference with a white nav and calm headshot-led hero, so the primary homepage now opens with Bruce's portrait and the large clinical-care headline on a pale background.
  - date: 2026-04-17
    decision: Refine the editorial fold toward an all-white premium layout.
    rationale: User asked to remove the grey/green band, enlarge Bruce's headshot, round the portrait edges, remove the red inset frame, and reduce the headline size.
  - date: 2026-04-17
    decision: Add a hamburger navigation pattern for mobile.
    rationale: User asked to clean up the mobile header and move links behind a hamburger menu while keeping the desktop header intact.
  - date: 2026-04-17
    decision: Reintroduce Bruce's original site copy into the modern homepage.
    rationale: User wanted to keep the legacy copy; homepage now includes the welcome message, key benefits, and full programming set language in the new premium layout.
  - date: 2026-04-17
    decision: Clarify header and hero credentials copy.
    rationale: User wanted the header subtitle to indicate Coconut Creek and virtual care, and the hero eyebrow to include Bruce's DPT credential.
  - date: 2026-05-01
    decision: Add B&W in-session action photo to the About section.
    rationale: User provided a professional B&W photo of Bruce working with a patient; replaces the duplicate headshot in the About section while keeping the portrait in the hero.
  - date: 2026-05-01
    decision: Remove emojis from service cards and credential trust bar.
    rationale: User did not want emojis in the What We Offer cards or the credential strip below the hero.
  - date: 2026-05-01
    decision: Replace emoji pill badges in credential strip with a clean typographic treatment.
    rationale: Redesigned as a single tracked all-caps line with dot separators — no icons, no color, editorial and clinical in feel.
  - date: 2026-05-01
    decision: Remove full-viewport min-height from hero section.
    rationale: The fold was forcing full-screen height even when content was shorter, creating excessive dead space before the credential strip.
  - date: 2026-05-01
    decision: Increase credential strip font size for prominence.
    rationale: User felt the credentials were too small; bumped from 0.69rem to 0.81rem with slightly darker gray.
  - date: 2026-05-13
    decision: Integrate real testimonials from Notion database into Section 7.
    rationale: Four approved entries pulled from Notion (Brendan Meehan, Paul Duffe, Joseph Leo, Olga & Ozzie Brannon). Featured Brendan Meehan as a full-width card because his quote directly references DPT credential, reinforcing Bruce's authority. Howard Kurpit testimonial excluded — marked Needs Review, Use on Website = NO.
  - date: 2026-05-26
    decision: Refine About section with editorial whitespace (drop navy accent block and white story card).
    rationale: Bruce flagged the desktop bio-photo placement; the original layout had the white story card overlapping the photo and a heavy navy accent block behind it, which read as dated and conflicted with the premium/calm/clinical direction. Photo now sits on flat #fafafa background with captions below; story column has no background or shadow, letting whitespace and typography carry the section. Mobile stack unchanged in feel.
  - date: 2026-05-26
    decision: Switch GitHub Pages deploys to the develop branch.
    rationale: "Pages now acts as the staging/preview site (auto-deploys from develop); main is reserved for production at the eventual hosting target. Required adding develop to the github-pages environment's deployment branch policies. Workflow going forward: feature/* → develop (auto preview) → main (prod)."
  - date: 2026-08-29
    decision: Crimson #c41230 with deep green #085041 confirmed as the canonical palette.
    rationale: Three sources disagreed — the v1.1 design review specified teal #1D9E75/#0F6E56, this file claimed #0f6e56, and the shipped CSS used crimson with no teal anywhere. Bruce confirmed the shipped crimson is correct; it is closer to the original brand red. The teal direction is retired.
  - date: 2026-08-29
    decision: Split Services from Programs as two separate axes.
    rationale: The legacy /services/* URLs (Personal Training, Online Training, Health Evaluations) are delivery modes; the homepage grid (Senior Fitness, Youth Sports, etc.) is specialty areas. They are orthogonal — a specialty is delivered through a service — and flattening both under one nav item made the offering hard to parse. Services keeps the legacy URLs and their search indexing; Programs becomes a separate section.
  - date: 2026-08-29
    decision: One /programs page covering all seven specialties, not seven pages.
    rationale: Each specialty currently has a title and a one-line teaser. Seven pages built from that would be thin, near-duplicate content — discounted by search engines and read as padding by visitors, which works against the professionalism the redesign is for. Individual specialty pages get promoted only when there is real content behind them. Also keeps the WordPress theme port at a manageable number of templates.
  - date: 2026-08-29
    decision: Howard Kurpit testimonial approved for publication.
    rationale: Previously held at Needs Review / Use on Website = NO pending confirmation of attribution and facility context. Bruce cleared it 2026-08-29; the Notion testimonials record is now Approved / Use on Website = YES. It was already present in the code, so no change was needed there.
  - date: 2026-08-29
    decision: Extract a shared Base layout and give every route its own metadata.
    rationale: Nav, footer and head were inlined in index.astro, so adding routes would have duplicated them and every page would have shared the homepage's title, description, canonical and OG tags. Base.astro now takes per-page values; canonical and OG always resolve to the production domain even in GitHub Pages preview builds.
  - date: 2026-08-29
    decision: Recover the legacy service copy from the WordPress REST API rather than rewriting it.
    rationale: The three /services/* posts stopped rendering when the custom theme took over, but the content was still in the WP database and readable at /wp-json/wp/v2/posts. It is Bruce's own copy and needed only typo and regional-phrasing edits.
  - date: 2026-11-03
    decision: Merge develop's 2026-08-29 work into the five-page rebuild, keeping the five-page code and develop's recorded decisions.
    rationale: feature/multipage was built on a Mac mini clone whose develop had never been fetched past 2026-05-29, so it missed the 08-29 service-pages merge. The five-page IA (2026-09-19, Services as one deep page, only Health Evaluation earns its own URL) supersedes the per-service /services/<slug> pages, and public/_redirects already 301s the three legacy service URLs to their /services sections. Base.astro, src/data/services.ts and the /services/<slug> routes were dropped; the recovered WordPress service copy stays in git history at 3c6e71d. The crimson palette Bruce confirmed on 08-29 is what the five-page build already ships, so the accent question on the review page is already answered.
  - date: 2026-11-03
    decision: GitHub Pages preview builds are served noindex, nofollow.
    rationale: The preview is public and was indexable, which risks Google treating it as a duplicate of vhwpt.com. Site.astro emits the robots tag whenever the build's site is not https://www.vhwpt.com.

  - date: 2026-11-03
    decision: Premium redesign follows the Superpower-based direction, built as the A3 room variant.
    rationale: "Justin asked for the site to feel as premium as donovanhunter.com without copying it. The premium-site process ran Refero research, a reference lock and three rendered directions; Justin moved the hero to an animated living room and approved A3 ('lets go with this for now'). Evidence and every decision are in design/ (brief, research, lock, ledger, tokens, directions)."
  - date: 2026-11-03
    decision: Drop deep green #085041; crimson #c41230 is the only accent.
    rationale: "The primary reference allows one accent with one job. Justin approved the drop ('Drop green (Recommended)'). It changes the palette Bruce confirmed on 2026-08-29, so it is flagged for his review."
  - date: 2026-11-03
    decision: The home hero is a generated living room, an 8s curtain loop through an open window with the treatment table as a separate still layer that never moves.
    rationale: "Justin's idea of a room with something alive in it. The curtains move because the window is open; an earlier cut with a closed window, and one where the table drifted with the pointer, were rejected. Placeholder until a real client room is filmed."
  - date: 2026-11-03
    decision: Generated images carry an 'AI photo' tag only when a person is in frame.
    rationale: "Justin: 'remove the ai photo tag if there is no person in the frame'. The tag exists so placeholder people are replaced before launch."
  - date: 2026-11-03
    decision: The Book form is a visible placeholder until it is wired to Bruce's server.
    rationale: "Submitting sends nothing and shows the phone number and email instead, so no request is lost silently (ENH-385)."
  - date: 2026-11-03
    decision: Pause the hero curtain loop; the hero shows its first frame as a still.
    rationale: "Justin: 'it doesn't feel flowy its kinda jerky'. The clip is 24fps over 8s. Re-time or smooth it before regenerating; he doesn't want a new video right now (ENH-392)."

