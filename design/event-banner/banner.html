<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Valencia Health &amp; Wellness · 33x81 retractable banner</title>
<!--
  The event banner: one artboard, six versions, worded for three audiences. Open this file with
  ?v=<version> (the words for each are in COPY, at the bottom of this file):
    patients-steady, patients-care               Patients
    therapists-together, therapists-next-step    Other PTs
    facilities-walking, facilities-on-site       Facilities
  Add &nobleed=1 for the exact 33 x 81 trim (the default has 0.125" bleed, 33.25 x 81.25),
  &guides=1 to draw the trim, safe area and the zones the stand hides, and &dark=1 for a dark
  body (not built by default). build.sh turns each version into the files the /banner page
  links to, and checks that every line of text fits.
  All sizes are inches. The words come from Bruce's site (src/data/site.ts, questions.ts and the
  home page). The QR code is https://www.vhwpt.com/qr, a redirect set in
  deploy/lightsail/sites/vhwpt.caddy.
-->
<style>
  @font-face{font-family:'Inter';font-weight:400;src:url('../../public/assets/fonts/inter-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:700;src:url('../../public/assets/fonts/inter-latin-700-normal.woff2') format('woff2');}
  :root{
    --ink:#18181b; --white:#ffffff; --crimson:#c41230;
    --grey-d:#d4d4d8; --grey-l:#52525b; --whisper:#f4f4f5;
    --W:33.25in; --H:81.25in;
  }
  html.nobleed{--W:33in;--H:81in}
  body.t-dark{--page:var(--ink);--fg:#fff;--muted:var(--grey-d);--card:#fff}
  body.t-white{--page:#fff;--fg:var(--ink);--muted:var(--grey-l);--card:var(--whisper)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{width:var(--W);height:var(--H);background:var(--page,#fff)}
  body{font-family:'Inter',system-ui,sans-serif;font-weight:700;color:var(--fg);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .art{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:var(--page)}
  .box{position:absolute;left:.125in;top:.125in;width:33in;height:81in}
  html.nobleed .box{left:0;top:0}
  .abs{position:absolute}
  .c{left:0;width:33in;text-align:center}
  .l{display:inline-block;white-space:nowrap}

  /* dark option: white header over an ink body */
  .white{left:-.125in;top:-.125in;width:33.25in;height:17.025in;background:#fff}
  .ink{left:-.125in;top:16.9in;width:33.25in;height:65in;background:var(--ink)}
  .t-white .white,.t-white .ink{display:none}

  /* the logo file has a faint square behind the badge: crop it to the badge's own circle */
  .logo{left:12in;top:2.9in;width:9in;height:9in;clip-path:circle(47.6% at 50% 50%)}
  .name{top:12.8in;font-size:2.3in;line-height:1;letter-spacing:-.012em;color:var(--ink)}
  .pulse{left:-.125in;top:13.9in;width:33.25in;height:6in;overflow:visible}

  /* headline and the line under it share a zone, centered, so a shorter headline stays balanced */
  .top{left:0;top:17.6in;width:33in;height:16.4in;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .h1{line-height:1.03;letter-spacing:-.024em}
  .sub{margin-top:1.1in;font-size:2in;line-height:1.2;font-weight:400;letter-spacing:-.006em}

  .card{left:2in;top:34.4in;width:29in;height:9.8in;background:var(--card);border-radius:.9in}
  .tile{left:21.6in;top:35.1in;width:8.4in;height:8.4in;background:#fff;border-radius:.6in}
  .qr{left:22.6in;top:36.1in;width:6.4in;height:6.4in}
  .arrow{left:17.9in;top:38.65in;width:2.1in;height:1.3in;transform:scaleX(-1)}
  .scan{left:3.6in;top:35.5in;text-align:left;color:var(--ink);font-size:2.45in;line-height:1.05;letter-spacing:-.018em}
  .url{left:3.6in;top:41.05in;font-size:2in;line-height:1;color:var(--crimson);letter-spacing:-.012em}

  .difflabel{left:2.4in;top:47.2in;font-size:2.25in;line-height:1;letter-spacing:-.015em;color:var(--fg)}
  .bullets{left:2.4in;top:51in;width:28.2in;list-style:none}
  .bullets li{position:relative;padding-left:2.1in;margin-bottom:var(--bgap,1.15in);font-weight:400;font-size:var(--bs,1.95in);line-height:1.2;letter-spacing:-.008em;white-space:nowrap;color:var(--fg)}
  .bullets li::before{content:"";position:absolute;left:.1in;top:calc(var(--bs,1.95in) * .6 - .4in);width:.8in;height:.8in;border-radius:50%;background:var(--crimson)}

  .phone{top:67.6in;font-size:2.2in;line-height:1;letter-spacing:-.012em;color:var(--fg)}
  .loc{top:70.6in;font-size:1.4in;line-height:1;font-weight:400;color:var(--muted)}

  /* print guides: add &guides=1 */
  .guides{display:none}
  html.g .guides{display:block}
  .guides div{position:absolute;pointer-events:none}
  .gt{left:0;top:0;width:33in;height:81in;border:.03in solid #00b7ff}
  .gs{left:.75in;top:.75in;width:31.5in;height:79.5in;border:.03in dashed #19c37d}
  .gtop{left:0;top:0;width:33in;height:.5in;background:rgba(255,0,60,.35)}
  .gbot{left:0;top:75in;width:33in;height:6in;background:rgba(255,0,60,.35)}
  .gbot2{left:0;top:71in;width:33in;height:4in;background:rgba(255,170,0,.22)}
  .gscan{left:0;top:33in;width:33in;height:.03in;background:#ff0}
</style>
</head>
<body>
<div class="art"><div class="box">

  <div class="abs white"></div>
  <div class="abs ink"></div>

  <img class="abs logo" src="logo.jpg" alt="Valencia Health &amp; Wellness">
  <div class="abs c name">Dr. Bruce Valencia, DPT</div>

  <!-- the pulse line from the logo, running across the seam under the header -->
  <svg class="abs pulse" viewBox="0 0 33.25 6" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 3 H11.9 L12.7 3 L13.5 2.45 L14.3 3 L15 3.5 L16 1.5 L17.1 4.9 L17.9 3 L19 2.4 L19.9 3 H33.25"
          fill="none" stroke="#c41230" stroke-width=".34" stroke-linejoin="round" stroke-linecap="butt"/>
  </svg>

  <div class="abs top"><div class="h1" id="h1"></div><div class="sub" id="sub"></div></div>

  <!-- scan block: the card, a white tile for the quiet zone, the QR (https://www.vhwpt.com/qr), an arrow, the words -->
  <div class="abs card"></div>
  <div class="abs tile"></div>
  <img class="abs qr" src="qr.svg" alt="QR code to vhwpt.com">
  <svg class="abs arrow" viewBox="0 0 22 13" xmlns="http://www.w3.org/2000/svg">
    <path d="M21 6.5 H2.2 M7.6 1.2 L2.2 6.5 L7.6 11.8" fill="none" stroke="#c41230" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="abs scan" id="scan"></div>
  <div class="abs url">vhwpt.com</div>

  <div class="abs difflabel" id="label"></div>
  <ul class="abs bullets" id="bullets"></ul>

  <div class="abs c phone">1-954-299-6536</div>
  <div class="abs c loc">Broward &amp; Palm Beach County</div>

  <div class="guides">
    <div class="gt"></div><div class="gs"></div><div class="gtop"></div><div class="gbot2"></div><div class="gbot"></div><div class="gscan"></div>
  </div>
</div></div>
<script>
  /* The words. Each line is set on its own so it breaks where it should. `size` is the headline
     size in inches (a longer headline gets a smaller size so it fits). Keep each bullet to one
     line; build.sh fails if any line is too wide. */
  var COPY = {
    'patients-care': {
      h1: ['Care that', 'comes to you.'], size: 4.4,
      sub: ['Physical therapy in your home', 'or care facility.'],
      scan: ['Scan to', 'meet Bruce'], label: 'What you get:',
      bullets: ['Findings in plain words', 'A written plan to follow', 'From recovery to strength', 'Your physician in the loop']
    },
    /* For the senior mobility class: the Senior Fitness page's own words ("Staying steady on your
       feet", and its list of what it covers). Bigger bullets, since there are only three. */
    'patients-steady': {
      h1: ['Stay steady', 'on your feet.'], size: 4.4,
      sub: ['Mobility and strength with', 'a Doctor of Physical Therapy.'],
      scan: ['Scan to', 'learn more'], label: 'What you build:', bsize: 2.25, bgap: 1.5,
      bullets: ['Balance and steadiness', 'Mobility and walking', 'Strength for daily tasks']
    },
    'therapists-together': {
      h1: ['Let’s work', 'together.'], size: 4.8,
      sub: ['Refer a patient,', 'or work with Bruce.'],
      scan: ['Scan to', 'connect'], label: 'Working with Bruce:',
      bullets: ['Doctor of Physical Therapy', 'CLT, dry needling, ISSA-CPT', 'Home and facility visits', 'Referrals welcome']
    },
    'therapists-next-step': {
      h1: ['A next step', 'for your patients.'], size: 3.4,
      sub: ['Therapy at home or', 'in a care facility.'],
      scan: ['Scan to', 'connect'], label: 'Working with Bruce:',
      bullets: ['Physician coordination', 'Home and facility visits', 'CLT, dry needling, ISSA-CPT', 'Referrals welcome']
    },
    'facilities-walking': {
      h1: ['Keep residents', 'walking.'], size: 4.0,
      sub: ['Physical therapy in', 'your care facility.'],
      scan: ['Scan to', 'meet Bruce'], label: 'What you get:',
      bullets: ['Fall-risk assessments', 'Balance and gait training', 'A written plan per resident', 'Their physician in the loop']
    },
    'facilities-on-site': {
      h1: ['Care that comes', 'to residents.'], size: 3.8,
      sub: ['In your care facility,', 'including memory care.'],
      scan: ['Scan to', 'meet Bruce'], label: 'What you get:',
      bullets: ['Fall-risk assessments', 'Neurological care', 'A written plan per resident', 'Their physician in the loop']
    }
  };

  var q = new URLSearchParams(location.search);
  var id = q.get('v') || 'patients-care', c = COPY[id] || COPY['patients-care'];
  var root = document.documentElement;
  document.body.classList.add(q.get('dark') ? 't-dark' : 't-white');
  if (q.get('nobleed')) root.classList.add('nobleed');
  if (q.get('guides')) root.classList.add('g');

  function lines(el, arr) {
    el.textContent = '';
    arr.forEach(function (t, i) {
      if (i) el.appendChild(document.createElement('br'));
      var s = document.createElement('span'); s.className = 'l'; s.textContent = t; el.appendChild(s);
    });
  }
  lines(document.getElementById('h1'), c.h1);
  document.getElementById('h1').style.fontSize = c.size + 'in';
  lines(document.getElementById('sub'), c.sub);
  lines(document.getElementById('scan'), c.scan);
  document.getElementById('label').textContent = c.label;
  if (c.bsize) document.getElementById('bullets').style.setProperty('--bs', c.bsize + 'in');
  if (c.bgap) document.getElementById('bullets').style.setProperty('--bgap', c.bgap + 'in');
  c.bullets.forEach(function (t) {
    var li = document.createElement('li'); li.textContent = t; document.getElementById('bullets').appendChild(li);
  });

  var st = document.createElement('style');
  st.textContent = '@page{size:' + (q.get('nobleed') ? '33in 81in' : '33.25in 81.25in') + ';margin:0}';
  document.head.appendChild(st);

  /* Fit check, read by build.sh: every headline and sub line must sit inside the 2in side
     margins, the scan words inside the card, and every bullet inside the safe width. */
  document.fonts.ready.then(function () {
    var bad = [], IN = 96;
    function width(el) { return el.getBoundingClientRect().width / IN; }
    document.querySelectorAll('#h1 .l, #sub .l').forEach(function (e) { if (width(e) > 29.0) bad.push('"' + e.textContent + '" is ' + width(e).toFixed(1) + 'in wide'); });
    document.querySelectorAll('#scan .l').forEach(function (e) { if (width(e) > 13.6) bad.push('"' + e.textContent + '" is ' + width(e).toFixed(1) + 'in wide'); });
    document.querySelectorAll('#bullets li').forEach(function (e) {
      var r = document.createRange(); r.selectNodeContents(e);
      var w = r.getBoundingClientRect().width / IN;
      if (w > 26.1) bad.push('bullet "' + e.textContent + '" is ' + w.toFixed(1) + 'in wide');
    });
    document.body.setAttribute('data-fit', bad.length ? 'FAIL: ' + bad.join('; ') : 'ok');
  });
</script>
</body>
</html>
